name: release

# Auto-release on merge to main.
# When a merge lands on main and plugin.json's version has no matching git tag yet,
# this workflow validates, then creates the tag + GitHub Release with notes pulled
# from the matching CHANGELOG.md section. Idempotent: if the tag already exists it exits.

on:
  push:
    branches: [main]

permissions:
  contents: write   # create tags + releases

# Two rapid merges to main would both see "tag does not exist" and race
# `gh release create`; the loser fails red instead of skipping.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags needed for the existence check

      - name: Read plugin version
        id: ver
        run: |
          VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::no structured \"version\" in .claude-plugin/plugin.json"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VERSION"

      - name: Skip if release already exists
        id: check
        run: |
          if git rev-parse "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.ver.outputs.version }} already exists — nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # A push can carry several version bumps (v2.0.1 + v2.0.2 + v2.1.0 all landed
      # in one push once). This job only ever reads plugin.json at HEAD, so the
      # intermediate versions were documented in the CHANGELOG but never tagged or
      # released — unpinnable and undiffable. Catch the skip instead of repeating it.
      - name: Guard — no CHANGELOG version skipped
        if: steps.check.outputs.exists == 'false'
        run: |
          CURRENT="${{ steps.ver.outputs.version }}"
          HIGHEST_TAG=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)
          [ -n "$HIGHEST_TAG" ] || HIGHEST_TAG="0.0.0"
          SKIPPED=""
          for v in $(sed -n 's/^## v\([0-9][0-9.]*\) .*/\1/p' CHANGELOG.md); do
            [ "$v" = "$CURRENT" ] && continue
            git rev-parse "v$v" >/dev/null 2>&1 && continue
            # only versions this push jumps over: newer than every tag, older than HEAD's
            newer_than_tag=$(printf '%s\n%s\n' "$HIGHEST_TAG" "$v" | sort -V | tail -1)
            older_than_cur=$(printf '%s\n%s\n' "$CURRENT" "$v" | sort -V | head -1)
            if [ "$newer_than_tag" = "$v" ] && [ "$older_than_cur" = "$v" ]; then
              SKIPPED="$SKIPPED $v"
            fi
          done
          if [ -n "$SKIPPED" ]; then
            echo "::error::CHANGELOG documents version(s)$SKIPPED between the newest tag" \
                 "(v$HIGHEST_TAG) and this release (v$CURRENT), but they have no tag." \
                 "Releasing v$CURRENT now would bury them. Tag them at their bump commits" \
                 "(git tag vX.Y.Z <sha> && git push origin vX.Y.Z), then re-run — or fold" \
                 "their notes into the v$CURRENT entry if they were never meant to ship."
            exit 1
          fi
          echo "No skipped versions between v$HIGHEST_TAG and v$CURRENT."

      - name: Validate (hard gate)
        if: steps.check.outputs.exists == 'false'
        # Kept byte-for-byte in step with validate.yml — a PR must fail for the same
        # reasons the release does, or the signal arrives after the merge.
        env:
          GROW_LINT_REQUIRE_YAML: "1"
        run: |
          python3 -m pip install --quiet pyyaml
          bash testing/validate-consistency.sh
          python3 testing/skill_lint.py

      - name: Extract CHANGELOG notes
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # Stop at the next entry in EITHER heading style: current "## vX.Y.Z (date)"
          # or the legacy "## [X.Y.Z] — date" used up to v1.6.0.
          awk -v ver="^## v${VERSION//./\\.} " '
            $0 ~ ver { flag=1; next }
            /^## v|^## \[/ { if (flag) exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          # trim leading/trailing blank lines and a trailing "---" separator
          sed -i -e '/^---[[:space:]]*$/d' release-notes.md
          awk 'NF{p=1} p' release-notes.md > .rn && mv .rn release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no CHANGELOG section found for v$VERSION"; exit 1
          fi
          echo "----- release notes preview -----"; head -20 release-notes.md

      - name: Create tag and GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          gh release create "v$VERSION" \
            --target "${{ github.sha }}" \
            --title "v$VERSION" \
            --notes-file release-notes.md
          echo "Published Release v$VERSION"
