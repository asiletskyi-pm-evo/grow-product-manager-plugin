name: claude-review

# One Claude code review per pull request, at the moment it leaves draft.
# It comments; it never approves, blocks or merges — a merge into main stays the
# maintainer's explicit yes (CLAUDE.md).
#
# The review is the `code-review` plugin run by Claude Code GitHub Actions
# (https://code.claude.com/docs/en/github-actions). It reads CLAUDE.md, which sends it
# to REVIEW.md for what counts as Important here and what not to report.
#
# Authentication is the maintainer's own Claude subscription: the repository secret
# CLAUDE_CODE_OAUTH_TOKEN, made once with `claude setup-token`. Every run spends that
# subscription's usage, which is why the trigger is `ready_for_review` alone and not
# every push. Without the secret the job says so and passes — it gates nothing.

on:
  pull_request:
    types: [ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # A fork's pull request gets no secrets on a public repository, so the review could
    # only fail there: skip it instead of showing a red job the contributor cannot fix.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: No token, no review
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set — the review is skipped. Run 'claude setup-token' and add the token as a repository secret."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
