# App profiles of the desktop shell (v4.13.0; shell 2: the side rail, the chart blocks). Shell code and placeholders only: a user's values live in the
# published page or its database, never here. Checked by `python3 scripts/app_shell.py check`.
version: 2
profiles:
  cjm:
    level: app
    title: {uk: "CJM", en: "CJM"}
    icon: {glyph: journey}
    permissions: [notifications, menu-bar]
    modules:
      - {id: portfolio, block: table, source: portfolio, home: true, title: {uk: "Портфель", en: "Portfolio"}}
      - {id: map, block: map, source: map, title: {uk: "Карти", en: "Maps"}}
      - {id: funnel, block: chart, source: funnel, title: {uk: "Воронка", en: "Funnel"}}
      - {id: edits, block: feed, source: "@edits", title: {uk: "Правки команди", en: "Team edits"}}
    menu: [portfolio, map, funnel, {action: edit, accel: "CmdOrCtrl+E"}, edits, {action: open-in-claude}]
    badge: "@edits.pending"
    tray: {title: portfolio.weakest, menu: map}
    notify: [edits.new, threshold.crossed]
    connectors: [{role: issue-status, needs: "<jira_project>"}, {role: funnel-numbers, needs: "<dashboard_id>"}]
    commands: []
  pm-os:
    level: app
    layout: rail
    title: {uk: "PM OS", en: "PM OS"}
    icon: {glyph: os, image: plugin}
    permissions: [notifications, menu-bar]
    modules:
      - {id: today, home: true, title: {uk: "Сьогодні", en: "Today"}, blocks: [{block: lead, source: "@summary"}, {block: feed, source: needs-you, title: {uk: "Чекає на тебе", en: "Needs you"}}, {block: day, source: meetings, title: {uk: "День за часом", en: "The day by time"}}, {block: list, source: focus, title: {uk: "Фокуси дня", en: "Focus of the day"}}, {block: list, source: signals, place: aside, title: {uk: "Сигнали", en: "Signals"}}]}
      - {id: directions, title: {uk: "Напрямки", en: "Directions"}, blocks: [{block: table, source: directions, title: {uk: "У роботі", en: "In progress"}}, {block: list, source: directions-rest, title: {uk: "На паузі й закриті", en: "Paused and closed"}}]}
      - {id: metrics, title: {uk: "Метрики", en: "Metrics"}, blocks: [{block: number, source: goal, title: {uk: "Головна ціль", en: "Main goal"}}, {block: bars, source: metrics-change, title: {uk: "Зміна до бази", en: "Change to the baseline"}}, {block: bars, source: metrics-compare, title: {uk: "Порівняння", en: "Comparison"}}, {block: line, source: metrics-trend, title: {uk: "Динаміка", en: "Over time"}}, {block: bars, source: metrics-periods, title: {uk: "За періодами", en: "By period"}}, {block: table, source: metrics, title: {uk: "Другий рівень", en: "Second level"}}]}
      - {id: rhythms, title: {uk: "Ритми", en: "Rhythms"}, blocks: [{block: table, source: rhythms, title: {uk: "Свіжість джерел", en: "Source freshness"}}, {block: feed, source: runs-log, title: {uk: "Журнал оновлень", en: "Update log"}}]}
      - {id: context, title: {uk: "Контекст", en: "Context"}, blocks: [{block: number, source: context-health, title: {uk: "Стан сховища", en: "Store health"}}, {block: list, source: context-inbox, title: {uk: "Запамʼятати?", en: "Remember?"}}]}
    menu: [today, directions, metrics, rhythms, context, {action: open-in-claude}]
    connectors: [{role: issue-status, needs: "<jira_project>"}]
    commands: []
