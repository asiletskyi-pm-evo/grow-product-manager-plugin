# App profiles of the desktop shell (v4.13.0; shell 2: the side rail, the chart blocks). Shell code and placeholders only: a user's values live in the
# published page or its database, never here. Checked by `python3 scripts/app_shell.py check`.
version: 2
profiles:
  cjm:
    level: app
    title: {uk: "CJM", en: "CJM"}
    icon: {glyph: journey}
    permissions: [notifications, menu-bar]
    modules:
      - {id: portfolio, block: table, source: portfolio, home: true, title: {uk: "Портфель", en: "Portfolio"}}
      - {id: map, block: map, source: map, title: {uk: "Карти", en: "Maps"}}
      - {id: funnel, block: chart, source: funnel, title: {uk: "Воронка", en: "Funnel"}}
      - {id: edits, block: feed, source: "@edits", title: {uk: "Правки команди", en: "Team edits"}}
    menu: [portfolio, map, funnel, {action: edit, accel: "CmdOrCtrl+E"}, edits]
    badge: "@edits.pending"
    tray: {title: portfolio.weakest, menu: map}
    notify: [edits.new, threshold.crossed]
    connectors: [{role: issue-status, needs: "<jira_project>"}, {role: funnel-numbers, needs: "<dashboard_id>"}]
    commands: []
  pm-os:
    level: app
    layout: rail
    title: {uk: "PM OS", en: "PM OS"}
    icon: {glyph: os, image: plugin}
    permissions: [notifications, menu-bar]
    modules:
      - {id: today, home: true, title: {uk: "Сьогодні", en: "Today"}, about: {uk: "Домашній екран: що чекає, день за часом, сигнали", en: "The home screen: what waits, the day by time, the signals"}, blocks: [{block: lead, source: "@summary"}, {block: feed, source: needs-you, title: {uk: "Чекає на тебе", en: "Needs you"}}, {block: day, source: meetings, title: {uk: "День за часом", en: "The day by time"}}, {block: list, source: focus, title: {uk: "Фокуси дня", en: "Focus of the day"}}, {block: list, source: signals, place: aside, title: {uk: "Сигнали", en: "Signals"}}, {block: list, source: sources, place: aside, title: {uk: "Свіжість джерел", en: "Source freshness"}}]}
      - {id: directions, title: {uk: "Напрямки", en: "Directions"}, about: {uk: "Епіки й релізи, які ти ведеш", en: "The epics and releases you lead"}, where: {uk: "напрямках", en: "directions"}, counts: {uk: ["застиг", "застигли", "застигло"], en: ["stalled", "stalled"]}, blocks: [{block: lead, source: directions-lead}, {block: table, source: directions, title: {uk: "У роботі", en: "In progress"}}, {block: list, source: directions-rest, title: {uk: "На паузі й закриті", en: "Paused and closed"}}]}
      - {id: metrics, title: {uk: "Метрики", en: "Metrics"}, about: {uk: "Ціль і головні метрики", en: "The goal and the key metrics"}, where: {uk: "метриках", en: "metrics"}, counts: {uk: ["сигнал", "сигнали", "сигналів"], en: ["signal", "signals"]}, blocks: [{block: lead, source: metrics-lead}, {block: number, source: goal, ask: {when: empty, label: {uk: "Задати базу", en: "Set the baseline"}, say: {uk: "Задай базу для головної цілі пульта", en: "Set the baseline for the pult's top goal"}}}, {block: bars, source: metrics-change, group: main, title: {uk: "Головні метрики", en: "Key metrics"}}, {block: bars, source: metrics-compare, group: main}, {block: table, source: metrics, group: main}, {block: number, source: metrics-pace, group: pace, title: {uk: "Темп", en: "Pace"}}, {block: bars, source: metrics-periods, group: pace}]}
      - {id: metric, under: metrics, title: {uk: "Метрика за часом", en: "A metric over time"}, back: {uk: "Усі метрики", en: "All metrics"}, blocks: [{block: lead, source: metric-lead}, {block: number, source: metric-value, group: trend, title: {uk: "Динаміка", en: "Over time"}}, {block: line, source: metrics-trend, group: trend}, {block: line, source: metric-split, title: {uk: "За розрізами", en: "By segment"}}, {block: table, source: metric-periods, title: {uk: "Останні періоди таблицею", en: "The last periods as a table"}}]}
      - {id: rhythms, title: {uk: "Ритми", en: "Rhythms"}, about: {uk: "Свіжість джерел і журнал оновлень", en: "The freshness of the sources and the log of updates"}, where: {uk: "ритмах", en: "rhythms"}, counts: {uk: ["застаріло", "застаріли", "застаріло"], en: ["stale", "stale"]}, blocks: [{block: lead, source: rhythms-lead}, {block: table, source: rhythms, title: {uk: "Джерела", en: "Sources"}}, {block: feed, source: runs-log, title: {uk: "Оновлення пульта", en: "Updates of the pult"}}]}
      - {id: context, title: {uk: "Контекст", en: "Context"}, about: {uk: "Стан записів і пропозиції", en: "The state of the records and the proposals"}, blocks: [{block: lead, source: context-lead}, {block: list, source: context-inbox, title: {uk: "Питання до тебе", en: "Questions for you"}}, {block: number, source: context-health, title: {uk: "Стан записів", en: "State of the records"}}]}
      - {id: settings, foot: true, title: {uk: "Налаштування", en: "Settings"}, blocks: [{block: lead, source: settings-lead}, {block: list, source: "@modules", title: {uk: "Модулі", en: "Modules"}}, {block: list, source: "@theme", title: {uk: "Тема", en: "Theme"}}, {block: list, source: settings-products, place: aside, title: {uk: "Продукти", en: "Products"}}, {block: list, source: settings-refresh, place: aside, title: {uk: "Оновлення даних", en: "Data updates"}, ask: {label: {uk: "Відкликати згоду", en: "Take the consent back"}, say: {uk: "Відклич згоду на пульт", en: "Take back the consent for the pult"}}}]}
    refresh: {source: refresh-note, label: {uk: "Оновити зараз", en: "Refresh now"}, say: {uk: "Онови пульт", en: "Refresh the pult"}}
    menu: [today, directions, metrics, rhythms, context]
    connectors: [{role: issue-status, needs: "<jira_project>"}]
    commands: []
