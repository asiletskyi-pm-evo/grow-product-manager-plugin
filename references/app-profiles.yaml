# App profiles of the desktop shell (v4.13.0; shell 2: the side rail, the chart blocks). Shell code and placeholders only: a user's values live in the
# published page or its database, never here. Checked by `python3 scripts/app_shell.py check`.
version: 2
profiles:
  cjm:
    level: app
    title: {uk: "CJM", en: "CJM"}
    icon: {glyph: journey}
    permissions: [notifications, menu-bar]
    modules:
      - {id: portfolio, block: table, source: portfolio, home: true, title: {uk: "Портфель", en: "Portfolio"}}
      - {id: map, block: map, source: map, title: {uk: "Карти", en: "Maps"}}
      - {id: funnel, block: chart, source: funnel, title: {uk: "Воронка", en: "Funnel"}}
      - {id: edits, block: feed, source: "@edits", title: {uk: "Правки команди", en: "Team edits"}}
    menu: [portfolio, map, funnel, {action: edit, accel: "CmdOrCtrl+E"}, edits]
    badge: "@edits.pending"
    tray: {title: portfolio.weakest, menu: map}
    notify: [edits.new, threshold.crossed]
    connectors: [{role: issue-status, needs: "<jira_project>"}, {role: funnel-numbers, needs: "<dashboard_id>"}]
    commands: []
  pm-os:
    level: app
    layout: rail
    title: {uk: "PM OS", en: "PM OS"}
    icon: {glyph: os, image: plugin}
    permissions: [notifications, menu-bar]
    modules:
      - {id: today, home: true, title: {uk: "Сьогодні", en: "Today"}, blocks: [{block: lead, source: "@summary"}, {block: feed, source: needs-you, title: {uk: "Чекає на тебе", en: "Needs you"}}, {block: day, source: meetings, title: {uk: "День за часом", en: "The day by time"}}, {block: list, source: focus, title: {uk: "Фокуси дня", en: "Focus of the day"}}, {block: list, source: signals, place: aside, title: {uk: "Сигнали", en: "Signals"}}, {block: list, source: sources, place: aside, title: {uk: "Свіжість джерел", en: "Source freshness"}}]}
      - {id: directions, title: {uk: "Напрямки", en: "Directions"}, counts: {uk: ["застиг", "застигли", "застигло"], en: ["stalled", "stalled"]}, blocks: [{block: lead, source: directions-lead}, {block: table, source: directions, title: {uk: "У роботі", en: "In progress"}}, {block: list, source: directions-rest, title: {uk: "На паузі й закриті", en: "Paused and closed"}}]}
      - {id: metrics, title: {uk: "Метрики", en: "Metrics"}, counts: {uk: ["сигнал", "сигнали", "сигналів"], en: ["signal", "signals"]}, blocks: [{block: lead, source: metrics-lead}, {block: number, source: goal}, {block: bars, source: metrics-change, group: main, title: {uk: "Головні метрики", en: "Key metrics"}}, {block: bars, source: metrics-compare, group: main}, {block: table, source: metrics, group: main}, {block: number, source: metrics-pace, group: pace, title: {uk: "Темп", en: "Pace"}}, {block: bars, source: metrics-periods, group: pace}, {block: line, source: metrics-trend, title: {uk: "Динаміка", en: "Over time"}}]}
      - {id: rhythms, title: {uk: "Ритми", en: "Rhythms"}, counts: {uk: ["застаріло", "застаріли", "застаріло"], en: ["stale", "stale"]}, blocks: [{block: lead, source: rhythms-lead}, {block: table, source: rhythms, title: {uk: "Джерела", en: "Sources"}}, {block: feed, source: runs-log, title: {uk: "Оновлення пульта", en: "Updates of the pult"}}]}
      - {id: context, title: {uk: "Контекст", en: "Context"}, blocks: [{block: lead, source: context-lead}, {block: list, source: context-inbox, title: {uk: "Питання до тебе", en: "Questions for you"}}, {block: number, source: context-health, title: {uk: "Стан записів", en: "State of the records"}}]}
    menu: [today, directions, metrics, rhythms, context]
    connectors: [{role: issue-status, needs: "<jira_project>"}]
    commands: []
