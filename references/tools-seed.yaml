# tools-seed.yaml — the tools the plugin already names, as the first records of a user's tools registry.
# Read by scripts/tools_scan.py (merge, suggest) and checked by validate-consistency.sh check 23;
# the protocol is references/tool-registry.md. A seed record claims nothing about the user's machine:
# until a scan or the session sees the tool, it is `not-installed`.
#
# Only tools a skill or a shared protocol of the plugin names belong here (integration-strategy.md 1a/1b,
# the optional research connectors, diagram-prototyper's external tools, the meeting sources), plus the
# examples the first three suggesting skills were decided with (v4.2.0). Every key of .mcp.json has a record.
# A host's own surfaces (pages, live documents, inline visuals, schedules, research) are not tools here —
# they are capabilities (native-surfaces.md).
#
# Fields (flat — the reader is ctx_common.read_yaml_records): id, name, kind, job, skills, contours, access,
# connect, publishes, aliases (other names a host lists it under), app_names / app_bundle_ids (how an
# installed app is recognised by the scan), via (another seed record that brings this one: when you have
# that tool, this one is not suggested), needs (what a step asks for — `suggest --need <tag>` offers only a
# record that carries the tag: mind-map, transcript, market-data …).
tools:
  - id: atlassian
    name: "Atlassian (Jira, Confluence)"
    kind: mcp
    job: "tasks, epics, sprints and the pages of requirements, reports and concepts"
    skills: [task-creator, requirements-creator, write-concept, product-reporter, sprint-planning, roadmap-architect, quarterly-planning]
    contours: [product, delivery, knowledge]
    access: corporate
    connect: "the plugin's Connectors tab → Atlassian; sign in with the work account"
    publishes: page
    aliases: [atlassian-rovo, atlassian_rovo, jira, confluence]
  - id: figma
    name: "Figma"
    kind: mcp
    job: "design files, frames and screenshots for handoff and design review"
    skills: [design-bridge, diagram-prototyper, requirements-creator]
    contours: [design]
    access: paid
    connect: "the plugin's Connectors tab → Figma"
    publishes: design
    aliases: [figma-desktop]
    app_names: [Figma]
    app_bundle_ids: [com.figma.Desktop]
    needs: [prototype, wireframe, design]
  - id: figjam
    name: "FigJam"
    kind: site
    job: "boards and diagrams on the Figma whiteboard"
    skills: [diagram-prototyper]
    contours: [design]
    access: paid
    connect: "through the Figma connector (its FigJam tools) or figma.com in the browser"
    publishes: board
    via: figma
    needs: [board, diagram, flowchart]
  - id: miro
    name: "Miro"
