# The slots of the context store (since v3.15.0) — the places in a record where an answer to a question lives.
# A slot is a question's answer, not a heading: `team.members` is "who is on the team" whether the record says
# `#### Members`, `#### Team Members` or `#### Склад команди`, and whether it sits in your own text or in a block a
# repository put there. scripts/ctx_slots.py reads this file; scripts/ctx_read.py (validator check 16) keeps it in
# step with references/context-manifest.yaml: every field or subsection the manifest names has a slot here.
#
#   <id>      `<record>.<name>`: the record kind, a dot, a short name. The id never changes once shipped.
#   kind      value — one line, one answer (a key, an address, an e-mail)
#             text  — prose or a table, read whole
#             list  — items, one per bullet or row
#   record    product | team | profile | org — the kind of record the slot is looked for in
#   names     headings and field names the slot answers to, English and Ukrainian, matched without regard to case;
#             the first is the name the manifest uses
#   about     one line, in Ukrainian, on what the slot holds — it is shown beside the text when the slot is explained
schema: context-slots/1
slots:
  product.description:
    kind: value
    record: product
    names:
      - Description
      - Опис
    about: "опис продукту: що він робить і для кого"
