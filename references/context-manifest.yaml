# What each skill reads at Step 0c when a context store exists (since v3.12.0) — `ctx read --skill <name>`.
# A translation of "Which Skills Read What" (skills/plugin-configurator/references/context-schema.md);
# validator check 16 keeps the two in step. references/context-protocol.md has the semantics.
#
#   product / team: required (missing → listed as obligatory), fields, sections — a field is its
#     `- **Field:** value` line, or the `#### Field` subsection when there is no such line; sections are
#     `####` subsections (heading text without the hashes). team: whole: true reads the whole record.
#   profile: required — fields of the User Profile, which is always read whole (every_skill).
#   settings / required_settings: setting records by the start of their title (case-insensitive), read whole.
#   full: true — the skill edits local-context.md and reads it whole; `ctx read` gives the card only.
#   search_types (since v3.16.0): the artifact types `ctx search --skill <name>` weighs × 1.2 — the main types of the
#     skill's SKILL_CONTEXT_MAP row (references/vault-protocol.md; a `(none …)` row is []); validator check 19 keeps
#     the two the same. `ctx read` does not use it.
